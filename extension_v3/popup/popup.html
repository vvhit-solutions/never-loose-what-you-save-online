<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div id="auth-pane" class="auth-pane">
        <div class="logo">Never Lose What You Save Online</div>
        <p class="auth-tagline">Your personal AI-powered second brain.</p>
        <button class="google-btn" id="login-btn">
            <svg viewBox="0 0 48 48">
                <path fill="#EA4335"
                    d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z">
                </path>
                <path fill="#4285F4"
                    d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z">
                </path>
                <path fill="#FBBC05"
                    d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z">
                </path>
                <path fill="#34A853"
                    d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z">
                </path>
                <path fill="none" d="M0 0h48v48H0z"></path>
            </svg>
            Sign in with Google
        </button>
    </div>

    <div id="main-content" style="display: none;">
        <div class="header">
            <div class="header-left">
                <div class="logo">Never Lose What You Save Online</div>
                <div id="user-info" class="user-info" style="display: none;">
                    <span id="user-name-display" class="user-name">...</span>
                </div>
            </div>
            <div id="connection-status" title="Connected to Cloud"
                style="width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 8px #2ecc71;">
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="save-pane">Save</button>
            <button class="tab-btn" data-tab="search-pane">Search</button>
            <button class="tab-btn" data-tab="settings-pane">Settings</button>
        </div>

        <!-- Save Pane -->
        <div id="save-pane" class="content-pane active">
            <div class="preview-card">
                <h2 class="page-title" id="page-title">Loading current page...</h2>
                <p class="page-url" id="page-url">...</p>
            </div>
            <button class="action-btn" id="save-btn">Remember this Page</button>
            <div id="save-status" class="status"></div>

            <!-- Memory Jog (Resurfacing) -->
            <div id="memory-jog" class="memory-jog">
                <div class="jog-header">Memory Jog</div>
                <div class="jog-content" id="jog-link">Fetching a memory to rediscover...</div>
            </div>
        </div>

        <!-- Search Pane -->
        <div id="search-pane" class="content-pane">
            <div class="search-box">
                <input type="text" id="search-input" class="search-input"
                    placeholder="Search memories (e.g. 'coding tips')">
            </div>
            <div id="recent-header"
                style="font-size: 10px; font-weight: 800; color: #666; margin-bottom: 10px; letter-spacing: 0.5px;">
                RECENT SAVES</div>
            <div id="results-list" class="results-list">
                <div style="text-align: center; color: #888; padding: 20px; font-size: 12px; opacity: 0.6;">Loading your
                    history...</div>
            </div>
        </div>

        <!-- Settings Pane -->
        <div id="settings-pane" class="content-pane">
            <div
                style="font-size: 11px; font-weight: 800; color: #666; margin-bottom: 12px; letter-spacing: 0.5px; text-transform: uppercase;">
                Manage Data</div>
            <div class="settings-pane">
                <button class="settings-btn" id="import-bookmarks-btn">
                    Import Chrome Bookmarks
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
                <button class="settings-btn" id="open-dashboard-btn">
                    <span>Open Full Dashboard <span class="badge soon">Coming Soon</span></span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                </button>
                <button class="settings-btn danger" id="logout-btn">
                    <span>Sign Out</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
            <div id="settings-status" class="status"></div>
        </div>
    </div>

    <script type="module" src="popup.js"></script>
</body>

</html>
