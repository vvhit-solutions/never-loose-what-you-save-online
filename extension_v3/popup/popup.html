<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="header">
        <div class="logo">Never Lose Again</div>
        <div id="connection-status" title="Connected to Cloud"
            style="width: 8px; height: 8px; border-radius: 50%; background: #2ecc71;"></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="save-pane">Save</button>
        <button class="tab-btn" data-tab="search-pane">Search</button>
        <button class="tab-btn" data-tab="settings-pane">Settings</button>
    </div>

    <!-- Save Pane -->
    <div id="save-pane" class="content-pane active">
        <div class="preview-card">
            <h2 class="page-title" id="page-title">Loading current page...</h2>
            <p class="page-url" id="page-url">...</p>
        </div>
        <button class="action-btn" id="save-btn">Remember this Page</button>
        <div id="save-status" class="status"></div>

        <!-- Memory Jog (Resurfacing) -->
        <div id="memory-jog" class="memory-jog" style="display: none;">
            <div class="jog-header">Memory Jog (2 days ago)</div>
            <div class="jog-content" id="jog-link">How to bake the perfect sourdough...</div>
        </div>
    </div>

    <!-- Search Pane -->
    <div id="search-pane" class="content-pane">
        <div class="search-box">
            <input type="text" id="search-input" class="search-input"
                placeholder="Search memories (e.g. 'coding tips')">
        </div>
        <div id="recent-header" style="font-size: 11px; font-weight: 700; color: #888; margin-bottom: 8px;">RECENT SAVES
        </div>
        <div id="results-list" class="results-list">
            <!-- Search results or recent items will appear here -->
            <div style="text-align: center; color: #888; padding: 20px; font-size: 12px;">Loading your history...</div>
        </div>
    </div>

    <!-- Settings Pane -->
    <div id="settings-pane" class="content-pane">
        <div style="font-size: 12px; color: #888; margin-bottom: 12px;">ACCOUNT & DATA</div>
        <button class="secondary-btn" id="import-bookmarks-btn">Import Chrome Bookmarks</button>
        <button class="secondary-btn" id="open-dashboard-btn">Open Full Dashboard ↗</button>
        <div id="settings-status" class="status"></div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
